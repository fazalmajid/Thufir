[project]
name = "thufir-e2e"
version = "0.1.0"
description = "Playwright end-to-end tests for Thufir, used to validate the RxDB migration"
requires-python = ">=3.11"
dependencies = [
    "pytest>=8.0",
    "playwright==1.47.0",
    "psycopg[binary]>=3.2",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["."]
